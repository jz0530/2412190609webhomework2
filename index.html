<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Finder</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1><span aria-hidden="true">🍴</span> Recipe Finder</h1>
      <p>Find delicious recipes from around the world</p>
    </header>
    <p class="credit">Data from <a href="https://www.themealdb.com/" target="_blank" rel="noopener noreferrer">TheMealDB</a> 👨‍🍳</p>
    <form id="search-form" class="search-container" role="search">
      <label class="sr-only" for="search-input">Search for meals or keywords</label>
      <input id="search-input" type="search" placeholder="Search for meals or keywords" aria-describedby="search-help" maxlength="100" autocomplete="off">
      <button id="search-btn" type="submit">Search</button>
    </form>
    <p id="search-help" class="search-help">Try an English meal name, such as chicken, pasta or beef.</p>
    <p id="error-container" class="error hidden" role="alert"></p>
    <section id="search-results" aria-labelledby="result-heading">
      <h2 id="result-heading" role="status" aria-live="polite"></h2>
      <div id="meals" class="meals-container"></div>
    </section>
    <section id="meal-details" class="meal-details hidden" aria-label="Recipe details">
      <button id="back-btn" type="button">← Back to recipes</button>
      <div class="meal-details-content"></div>
    </section>
  </main>
</body>
</html>
